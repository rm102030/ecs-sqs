version: "3.9"

services:

  # =========================================================
  # LocalStack
  # =========================================================

  localstack:
    image: localstack/localstack:latest

    ports:
      - "4566:4566"

    environment:
      - SERVICES=sqs,s3
      - DEBUG=1

    volumes:
      - "./init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh"
      - "./lifecycle.json:/etc/localstack/init/ready.d/lifecycle.json"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # =========================================================
  # DynamoDB Local
  # =========================================================

  dynamodb-local:
    image: amazon/dynamodb-local

    ports:
      - "8000:8000"

    command: "-jar DynamoDBLocal.jar -sharedDb"

  # =========================================================
  # Init DynamoDB
  # =========================================================

  init-dynamodb:
    image: amazon/aws-cli

    depends_on:
      - dynamodb-local

    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1

    entrypoint:
      - /bin/sh
      - -c
      - |
        sleep 15

        aws dynamodb create-table \
          --table-name notifications-idempotency \
          --attribute-definitions AttributeName=eventId,AttributeType=S \
          --key-schema AttributeName=eventId,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST \
          --endpoint-url http://dynamodb-local:8000 \
          --region us-east-1 || true

  # =========================================================
  # Jaeger
  # =========================================================

  jaeger:
    image: jaegertracing/all-in-one:1.57

    environment:
      - COLLECTOR_OTLP_ENABLED=true

    ports:
      - "16686:16686"
      - "14250:14250"

  # =========================================================
  # OpenTelemetry Collector
  # =========================================================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest

    command:
      - "--config=/etc/otelcol/config.yaml"

    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otelcol/config.yaml

    ports:
      - "4317:4317"
      - "4318:4318"

    depends_on:
      - jaeger

  # =========================================================
  # Producer API
  # =========================================================

  producer:
    build: ./producer

    ports:
      - "8001:8000"

    environment:
      CHANNEL: ${CHANNEL:-EMAIL}

    depends_on:
      localstack:
        condition: service_healthy

    restart: unless-stopped

  # =========================================================
  # Worker Principal
  # =========================================================

  worker:
    build: ./worker

    depends_on:
      localstack:
        condition: service_healthy

      init-dynamodb:
        condition: service_started

    restart: unless-stopped

  # =========================================================
  # Worker Error
  # =========================================================

  worker_error:
    build: ./worker_error

    depends_on:
      localstack:
        condition: service_healthy

      init-dynamodb:
        condition: service_started

    restart: unless-stopped

  # =========================================================
  # Worker DLQ
  # =========================================================

  worker_dlq:
    build: ./worker_dlq

    depends_on:
      localstack:
        condition: service_healthy

      init-dynamodb:
        condition: service_started

    restart: unless-stopped

  # =========================================================
  # Autoscaler
  # =========================================================

  autoscaler:
    build: ./autoscaler

    working_dir: /workspace

    depends_on:
      localstack:
        condition: service_healthy

    restart: unless-stopped

  # =========================================================
  # Prometheus
  # =========================================================

  prometheus:
    image: prom/prometheus:latest

    ports:
      - "9090:9090"

    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      - producer
      - worker
      - worker_error
      - worker_dlq

  # =========================================================
  # Grafana
  # =========================================================

  grafana:
    image: grafana/grafana:latest

    ports:
      - "3000:3000"

    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin

    depends_on:
      - prometheus
      - jaeger
      - loki

  # =========================================================
  # Loki
  # =========================================================

  loki:
    image: grafana/loki:latest

    ports:
      - "3100:3100"

    command: -config.file=/etc/loki/local-config.yaml

  # =========================================================
  # Promtail
  # =========================================================

  promtail:
    image: grafana/promtail:latest

    command: -config.file=/etc/promtail/config.yml

    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./observability/promtail.yml:/etc/promtail/config.yml

    depends_on:
      - loki

    restart: unless-stopped
