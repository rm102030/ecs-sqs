services:

  # =========================================================
  # Jaeger
  # =========================================================

  jaeger:
    image: jaegertracing/all-in-one:latest

    ports:
      - "16686:16686"
      - "14250:14250"

  # =========================================================
  # OpenTelemetry Collector
  # =========================================================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest

    command:
      - "--config=/etc/otelcol-contrib/config.yaml"

    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml

    ports:
      - "4317:4317"

    depends_on:
      - jaeger

  # =========================================================
  # DynamoDB Local
  # =========================================================

  dynamodb-local:
    image: amazon/dynamodb-local

    ports:
      - "8000:8000"

  # =========================================================
  # Init DynamoDB
  # =========================================================

  init-dynamodb:
    image: amazon/aws-cli

    depends_on:
      - dynamodb-local

    entrypoint: >
      sh -c "
      sleep 10 &&
      aws dynamodb create-table
      --table-name notifications-idempotency
      --attribute-definitions AttributeName=eventId,AttributeType=S
      --key-schema AttributeName=eventId,KeyType=HASH
      --billing-mode PAY_PER_REQUEST
      --endpoint-url http://dynamodb-local:8000
      --region us-east-1 || true
      "

    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1

  # =========================================================
  # LocalStack
  # =========================================================

  localstack:
    image: localstack/localstack

    ports:
      - "4566:4566"

    environment:
      - SERVICES=sqs

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================
  # Producer FastAPI
  # =========================================================

  producer:
    build: ./producer

    ports:
      - "8001:8000"

    depends_on:
      localstack:
        condition: service_healthy

    restart: always

  # =========================================================
  # Worker Normal
  # =========================================================

  worker:
    build: ./worker

    depends_on:
      localstack:
        condition: service_healthy

    restart: always

  # =========================================================
  # Worker Error
  # =========================================================

  worker-error:
    build: ./worker_error

    depends_on:
      localstack:
        condition: service_healthy

    restart: always

  # =========================================================
  # Worker DLQ
  # =========================================================

  worker-dlq:
    build: ./worker_dlq

    depends_on:
      localstack:
        condition: service_healthy

    restart: always
