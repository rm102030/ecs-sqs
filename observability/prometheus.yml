
global:
  scrape_interval: 15s

scrape_configs:

  - job_name: "producer"

    static_configs:
      - targets:
          - "producer:8004"

  - job_name: "worker"

    static_configs:
      - targets:
          - "worker:8002"

  - job_name: "worker_error"

    static_configs:
      - targets:
          - "worker_error:8003"

  - job_name: "worker_dlq"

    static_configs:
      - targets:
          - "worker_dlq:8005"

